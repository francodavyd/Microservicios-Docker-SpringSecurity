spring:
  application:
    name: productos-sv
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8081   # Puedes usar un puerto diferente para las pruebas

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


  security:
    enabled: false
    jwt:
      private:
        key: ${PRIVATE_KEY}
      user:
        generator: ${GENERATOR}